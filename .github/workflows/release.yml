name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes || true
        env:
          GH_TOKEN: ${{ github.token }}

  bump-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Bump formula in homebrew-tap
        env:
          # Fine-grained PAT with Contents:write on davidblurton/homebrew-tap,
          # stored as repo secret TAP_GITHUB_TOKEN.
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          url="https://github.com/davidblurton/dt/archive/refs/tags/${TAG}.tar.gz"
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          echo "url=$url"; echo "sha256=$sha"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/davidblurton/homebrew-tap.git" tap
          cd tap
          sed -i -E "s|^( *url ).*|\1\"$url\"|"        Formula/dt.rb
          sed -i -E "s|^( *sha256 ).*|\1\"$sha\"|"     Formula/dt.rb
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dt.rb
          git commit -m "dt ${TAG}" || { echo "no change"; exit 0; }
          git push
